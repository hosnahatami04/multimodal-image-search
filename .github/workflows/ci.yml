name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The CPU wheel index keeps this to ~200 MB instead of the ~2.5 GB CUDA
        # build, which CI has no use for.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 torchvision==0.29.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Test
        # Tests needing model weights or the 1 GB dataset are marked and
        # excluded here; everything else runs against the synthetic fixtures in
        # tests/conftest.py, so the suite is meaningful without any download.
        run: python -m pytest -v -m "not model and not data"
